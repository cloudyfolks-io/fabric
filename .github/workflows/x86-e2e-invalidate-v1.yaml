name: Invalidate an x86 E2E fixed check (v1)

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: Open pull request number
        required: true
        type: number
      headSHA:
        description: Pull request HEAD with the existing fixed check
        required: true
        type: string
      pushedRef:
        description: Original pushed branch (omitted by older v1 senders)
        required: false
        type: string
      pushedSHA:
        description: After SHA from the original push event
        required: false
        type: string
      forcedPush:
        description: Whether the original push was forced
        required: false
        type: boolean
      verifiedReceiverSHA:
        description: Default-branch revision verified by the push sender (omitted by earlier v1 senders)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  invalidate:
    if: github.actor == 'github-actions[bot]' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: x86-e2e-required-gate-${{ inputs.prNumber }}-${{ inputs.headSHA }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile the fixed check against the live target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.prNumber }}
          HEAD_SHA: ${{ inputs.headSHA }}
          PUSHED_REF: ${{ inputs.pushedRef }}
          PUSHED_SHA: ${{ inputs.pushedSHA }}
          FORCED_PUSH: ${{ toJSON(inputs.forcedPush) }}
          VERIFIED_RECEIVER_SHA: ${{ inputs.verifiedReceiverSHA }}
        run: |
          if [[ -n "$VERIFIED_RECEIVER_SHA" && "$GITHUB_WORKFLOW_SHA" != "$VERIFIED_RECEIVER_SHA" ]]; then
            echo "The receiver revision changed after verification; rerun the base-update sender." >&2
            exit 1
          fi
          python3 -I hack/e2e_invalidate.py
