name: Invalidate an x86 E2E fixed check (v1)

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: Open pull request number
        required: true
        type: number
      headSHA:
        description: Pull request HEAD with the existing fixed check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  invalidate:
    if: github.actor == 'github-actions[bot]' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: x86-e2e-required-gate-${{ inputs.prNumber }}-${{ inputs.headSHA }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile the fixed check against the live target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.prNumber }}
          HEAD_SHA: ${{ inputs.headSHA }}
        run: python3 -I hack/e2e_invalidate.py
