name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/cloudyfolks-io

jobs:
  base-amd64:
    name: Build and push amd64 base images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set base tag
        run: echo "BASE_TAG=$(cat BASE_VERSION)" >> "$GITHUB_ENV"

      - name: Check the registry for the base images
        id: check
        run: |
          build=0
          for tag in "$BASE_TAG-amd64" "$BASE_TAG-amd64-legacy" "$BASE_TAG-debug-amd64"; do
            if ! docker manifest inspect "$REGISTRY/fabric-base:$tag" >/dev/null 2>&1; then
              build=1
            fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.check.outputs.build == 1
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000

      - uses: actions/setup-go@v6
        if: steps.check.outputs.build == 1
        id: setup-go
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build and push amd64 base images
        if: steps.check.outputs.build == 1
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          make base-amd64 RELEASE_TAG="$BASE_TAG" DEBUG_TAG="$BASE_TAG-debug" LEGACY_TAG="$BASE_TAG-amd64-legacy"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-amd64"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-amd64-legacy"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-debug-amd64"

  base-amd64-dpdk:
    name: Build and push amd64 dpdk base image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set base tag
        run: echo "BASE_TAG=$(cat BASE_VERSION)" >> "$GITHUB_ENV"

      - name: Check the registry for the dpdk base image
        id: check
        run: |
          if docker manifest inspect "$REGISTRY/fabric-base:$BASE_TAG-dpdk" >/dev/null 2>&1; then
            echo "build=0" >> "$GITHUB_OUTPUT"
          else
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.build == 1
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 1

      - name: Build and push amd64 dpdk base image
        if: steps.check.outputs.build == 1
        run: |
          make base-amd64-dpdk RELEASE_TAG="$BASE_TAG"
          docker tag "$REGISTRY/fabric-base:$BASE_TAG-amd64-dpdk" "$REGISTRY/fabric-base:$BASE_TAG-dpdk"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-dpdk"

  base-arm64:
    name: Build and push arm64 base images
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set base tag
        run: echo "BASE_TAG=$(cat BASE_VERSION)" >> "$GITHUB_ENV"

      - name: Check the registry for the base images
        id: check
        run: |
          build=0
          for tag in "$BASE_TAG-arm64" "$BASE_TAG-debug-arm64"; do
            if ! docker manifest inspect "$REGISTRY/fabric-base:$tag" >/dev/null 2>&1; then
              build=1
            fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.check.outputs.build == 1
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000

      - uses: actions/setup-go@v6
        if: steps.check.outputs.build == 1
        id: setup-go
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build and push arm64 base images
        if: steps.check.outputs.build == 1
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          make base-arm64 RELEASE_TAG="$BASE_TAG" DEBUG_TAG="$BASE_TAG-debug"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-arm64"
          docker push "$REGISTRY/fabric-base:$BASE_TAG-debug-arm64"

  base-manifests:
    name: Publish multi-arch base manifests
    needs:
      - base-amd64
      - base-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set base tag
        run: echo "BASE_TAG=$(cat BASE_VERSION)" >> "$GITHUB_ENV"

      - name: Create multi-arch base manifests
        run: |
          docker buildx imagetools create -t "$REGISTRY/fabric-base:$BASE_TAG" \
            "$REGISTRY/fabric-base:$BASE_TAG-amd64" "$REGISTRY/fabric-base:$BASE_TAG-arm64"
          docker buildx imagetools create -t "$REGISTRY/fabric-base:$BASE_TAG-debug" \
            "$REGISTRY/fabric-base:$BASE_TAG-debug-amd64" "$REGISTRY/fabric-base:$BASE_TAG-debug-arm64"

  build-images:
    name: Build and push images
    needs: base-manifests
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      revision: ${{ steps.index.outputs.revision }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release tag
        run: |
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "$(cat VERSION)" ]; then
              printf 'The Git tag must match VERSION\n' >&2
              exit 1
            fi
          else
            tag="dev-$(git rev-parse --short HEAD)"
          fi
          base_tag=$(cat BASE_VERSION)
          base_digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$REGISTRY/fabric-base:$base_tag" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'TAG=%s\nBASE_TAG=%s@%s\nSOURCE_REVISION=%s\n' "$tag" "$base_tag" "$base_digest" "$revision" >> "$GITHUB_ENV"

      - name: Build amd64 binaries
        run: make build-go

      - name: Build and push amd64 image
        run: |
          docker buildx build --platform linux/amd64 --push \
            -t "$REGISTRY/fabric:$TAG-amd64" \
            --metadata-file "$RUNNER_TEMP/fabric-amd64-build.json" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --build-arg VERSION="$TAG" --build-arg BASE_TAG="$BASE_TAG" \
            --build-arg BASE_IMAGE="$REGISTRY/fabric-base" \
            -f dist/images/Dockerfile dist/images/

      - name: Build arm64 binaries
        run: make build-go-arm

      - name: Build and push arm64 image
        run: |
          docker buildx build --platform linux/arm64 --push \
            -t "$REGISTRY/fabric:$TAG-arm64" \
            --metadata-file "$RUNNER_TEMP/fabric-arm64-build.json" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --build-arg VERSION="$TAG" --build-arg BASE_TAG="$BASE_TAG" \
            --build-arg BASE_IMAGE="$REGISTRY/fabric-base" \
            -f dist/images/Dockerfile dist/images/

      - name: Create multi-arch manifest
        id: index
        run: |
          repository="$REGISTRY/fabric"
          amd64=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/fabric-amd64-build.json")
          arm64=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/fabric-arm64-build.json")
          docker buildx imagetools inspect --raw "$repository@$amd64" > "$RUNNER_TEMP/fabric-amd64-manifest.json"
          docker buildx imagetools inspect --raw "$repository@$arm64" > "$RUNNER_TEMP/fabric-arm64-manifest.json"
          docker buildx imagetools create -t "$repository:$TAG" "$repository@$amd64" "$repository@$arm64"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$repository:$TAG" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          docker buildx imagetools inspect --raw "$repository@$digest" > "$RUNNER_TEMP/fabric-index.json"
          docker buildx imagetools inspect --raw "$repository:$TAG" > "$RUNNER_TEMP/fabric-tag.json"
          if ! cmp -s "$RUNNER_TEMP/fabric-index.json" "$RUNNER_TEMP/fabric-tag.json"; then
            printf 'The Fabric tag differs from the published index\n' >&2
            exit 1
          fi
          hack/verify-release-index.py \
            "$amd64" "$RUNNER_TEMP/fabric-amd64-manifest.json" \
            "$arm64" "$RUNNER_TEMP/fabric-arm64-manifest.json" \
            "$digest" "$RUNNER_TEMP/fabric-index.json"
          for arch in amd64 arm64; do
            child=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' "$RUNNER_TEMP/fabric-index.json")
            if ! docker buildx imagetools inspect --format '{{json .Image}}' "$repository@$child" | jq -e --arg arch "$arch" --arg revision "$SOURCE_REVISION" '
              .os == "linux" and .architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $revision
            ' >/dev/null; then
              printf 'Published Fabric image for %s has the wrong platform or revision\n' "$arch" >&2
              exit 1
            fi
          done
          printf 'digest=%s\nrevision=%s\n' "$digest" "$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
          printf 'Fabric image `%s:%s@%s` from source revision `%s`\n' "$repository" "$TAG" "$digest" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    name: Publish helm chart
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set release tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Login to ghcr
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push chart
        run: |
          CHART_VERSION=$(sed -n 's/^version: //p' charts/fabric/Chart.yaml)
          if [ "${{ github.event_name }}" = "push" ] && [ "v$CHART_VERSION" != "$TAG" ]; then
            echo "chart version $CHART_VERSION does not match tag $TAG, run make sync-version and commit the result"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            CHART_VERSION="0.0.0-$TAG"
            helm package charts/fabric --version "$CHART_VERSION" --app-version "$TAG"
          else
            helm package charts/fabric
          fi
          helm push "fabric-$CHART_VERSION.tgz" "oci://$REGISTRY/charts"

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs:
      - build-images
      - publish-chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FABRIC_IMAGE_DIGEST: ${{ needs.build-images.outputs.digest }}
          FABRIC_SOURCE_REVISION: ${{ needs.build-images.outputs.revision }}
        run: |
          [[ "$FABRIC_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FABRIC_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          printf -v notes 'Fabric image `%s/fabric:%s@%s`\n\nSource revision `%s`\n\nInstall the chart with `helm install fabric oci://%s/charts/fabric --version %s`.\n' \
            "$REGISTRY" "$GITHUB_REF_NAME" "$FABRIC_IMAGE_DIGEST" "$FABRIC_SOURCE_REVISION" "$REGISTRY" "${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes"
