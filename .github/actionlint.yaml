paths:
  '.github/workflows/x86-e2e-{gate,invalidate-v1}.yaml':
    ignore:
      # actionlint 1.7.12 predates GitHub's concurrency.queue. The gate tests require queue: max on every fixed-check writer.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
